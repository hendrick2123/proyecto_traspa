version: '3.8'

services:
  web:
    build: .
    container_name: traspa_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    volumes:
      - ./frontend/uploads:/app/frontend/uploads
      - ./db.json:/app/db.json
      - ./sessions.json:/app/sessions.json
